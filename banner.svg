<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="squircle-ui banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1a1f"/>
      <stop offset="1" stop-color="#0c0c10"/>
    </linearGradient>
    <linearGradient id="rounded" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c33"/>
      <stop offset="1" stop-color="#1d1d22"/>
    </linearGradient>
    <linearGradient id="squircle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffb00"/>
      <stop offset="1" stop-color="#d9d500"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#fffb00" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fffb00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- soft brand glow behind squircle -->
  <circle cx="620" cy="220" r="180" fill="url(#glow)"/>

  <!-- Left: border-radius (circular arc, abrupt G1) -->
  <g transform="translate(220,140)">
    <rect x="0" y="0" width="160" height="160" rx="36" ry="36" fill="url(#rounded)"/>
    <text x="80" y="200" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#ffffff" fill-opacity="0.55" letter-spacing="0.5">border-radius</text>
    <text x="80" y="222" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#ffffff" fill-opacity="0.30" letter-spacing="0.5">G1 — arc of a circle</text>
  </g>

  <!-- Arrow -->
  <g transform="translate(450,220)" stroke="#ffffff" stroke-opacity="0.35" fill="none" stroke-width="1.5" stroke-linecap="round">
    <line x1="0" y1="0" x2="60" y2="0"/>
    <polyline points="50,-6 60,0 50,6"/>
  </g>

  <!-- Right: squircle (superellipse, smooth G2) -->
  <g transform="translate(540,140)">
    <path d="
      M 36 0
      L 124 0
      C 145 0 156 7 160 36
      L 160 124
      C 160 153 153 160 124 160
      L 36 160
      C 7 160 0 153 0 124
      L 0 36
      C 0 7 7 0 36 0
      Z" fill="url(#squircle)"/>
    <text x="80" y="200" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#fffb00" letter-spacing="0.5">squircle</text>
    <text x="80" y="222" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#ffffff" fill-opacity="0.45" letter-spacing="0.5">G2 — continuous superellipse</text>
  </g>

  <!-- Wordmark + tagline -->
  <g transform="translate(760,160)">
    <text x="0" y="0" font-family="ui-sans-serif, system-ui, -apple-system, Inter, Helvetica, Arial" font-weight="700" font-size="56" fill="#ffffff" letter-spacing="-1.5">squircle<tspan fill="#fffb00">-ui</tspan></text>
    <text x="2" y="34" font-family="ui-sans-serif, system-ui, -apple-system, Inter, Helvetica, Arial" font-weight="400" font-size="17" fill="#ffffff" fill-opacity="0.70" letter-spacing="-0.2">A Claude Code skill.</text>
    <text x="2" y="62" font-family="ui-sans-serif, system-ui, -apple-system, Inter, Helvetica, Arial" font-weight="400" font-size="15" fill="#ffffff" fill-opacity="0.45" letter-spacing="-0.1">Harmonizing digital life</text>
    <text x="2" y="82" font-family="ui-sans-serif, system-ui, -apple-system, Inter, Helvetica, Arial" font-weight="400" font-size="15" fill="#ffffff" fill-opacity="0.45" letter-spacing="-0.1">with the real world.</text>
  </g>
</svg>
